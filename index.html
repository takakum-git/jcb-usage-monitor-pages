<h1>JCB Usage Manager</h1>
<p>JCBカード家族カードの利用速報メールをGmailから検出し、月間利用額を集計してMattermostへ通知する、個人利用目的のツールです。</p>
<p>本アプリはGmail APIの読み取り専用スコープ（gmail.readonly）のみを使用し、開発者本人のGmailアカウントに届く特定の通知メールのみを読み取ります。取得した情報は開発者本人が管理するサーバー上にのみ保存され、第三者への提供は一切行いません。</p>
